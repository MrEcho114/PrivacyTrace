name: Verify scaffold
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --project apps/api --locked
      - run: uv run --project apps/api --locked pytest apps/api/tests
      - run: uv run --project apps/api --locked ruff check apps/api/src apps/api/tests
      - run: uv run --project apps/api --locked python scripts/export-schema.py
      - run: git diff --exit-code -- packages/contracts apps/web/src/contracts.generated.ts
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
