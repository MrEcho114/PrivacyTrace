[package]
name = "privacytrace-bridge-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "privacytrace_bridge_harness"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", default-features = false , features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-package-probe = { path = "../../tauri-plugin" }
