name: Verify PrivacyTrace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --project apps/api --locked --extra worker
      - run: uv run --project apps/api --locked --extra worker pytest apps/api/tests
      - run: uv run --project apps/api --locked --extra worker ruff check apps/api/src apps/api/tests scripts/export-schema.py
      - run: uv run --project apps/api --locked --extra worker python scripts/export-schema.py
      - run: git diff --exit-code -- packages/contracts apps/web/src/contracts.generated.ts
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
  isolated-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --project apps/api --locked --extra worker
      - run: docker build --file apps/api/worker.Dockerfile --tag privacytrace-worker:s1 .
      - run: uv run --project apps/api --locked --extra worker pytest apps/api/tests/test_isolated_cli.py apps/api/tests/test_pipeline_cli.py
        env:
          PRIVACYTRACE_DOCKER_TESTS: '1'
